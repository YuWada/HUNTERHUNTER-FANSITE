<!DOCTYPE html>

  <meta charset="UTF-8">

  <style>
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background-color: #ffffff;
      color: #333333;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-bottom: 20px;
      font-size: 24px;
    }
    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      resize: vertical;
      box-sizing: border-box;
    }
    
    .result-section {
      background-color: #f9f9f9;
      border: 1px solid #eeeeee;
      border-radius: 8px;
      padding: 15px;
    }
    .result-title {
      font-size: 14px;
      font-weight: bold;
      color: #666666;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .download-btn {
      background-color: #0f3460;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      transition: background 0.2s;
    }
    .download-btn:hover {
      background-color: #e94560;
    }
    .alert-msg {
      color: #e94560;
      font-size: 12px;
      margin-left: 10px;
    }

    #hiragana-output {
      font-size: 16px;
      word-break: break-all;
      white-space: pre-wrap; 
      line-height: 1.5;
    }
    
    #hunter-output-wrapper {
      background: #ffffff;
      padding: 20px;
      border: 1px dashed #ccc;
      display: block; 
      width: 100%;
      box-sizing: border-box;
    }
    
    #hunter-output {
      display: flex;
      flex-direction: column;
      gap: 0px; 
    }

    .hunter-line {
      display: flex;
      flex-wrap: wrap;
      column-gap: 0px; 
      row-gap: 0px;
      align-items: flex-end; 
    }
    
    .hunter-char {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }
    .small-char {
      width: 33.3px;
      height: 33.3px;
      margin-bottom: 0px; 
    }
    
    .unsupported-char {
      display: inline-block;
      width: 50px;
      height: 50px;
      line-height: 50px;
      text-align: center;
      font-size: 18px;
      color: #cccccc;
    }
    .small-char.unsupported-char {
      width: 33.3px;
      height: 33.3px;
      line-height: 33.3px;
      font-size: 14px;
    }

    #loading {
      color: #e94560;
      font-weight: bold;
      margin-bottom: 10px;
    }

    /* 五十音表用のスタイル */
    .table-section {
      width: 100%;
      max-width: 800px;
      margin-top: 40px;
    }
    .table-section h2 {
      font-size: 18px;
      margin-bottom: 10px;
      border-bottom: 2px solid #eeeeee;
      padding-bottom: 5px;
    }
    .hunter-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
      text-align: center;
    }
    .hunter-table td {
      border: 1px solid #dddddd;
      padding: 8px 4px;
      vertical-align: middle;
      width: 10%;
    }
    .hunter-table td.empty {
      background-color: #f5f5f5;
    }
    .td-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .td-content img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }
    .td-ruby {
      font-size: 12px;
      color: #555;
    }

  <script>
    function kataToHira(str) {
      return str.replace(/[\u30a1-\u30f6]/g, function(match) {
        var chr = match.charCodeAt(0) - 0x60;
        return String.fromCharCode(chr);
      });
    }

    const alphanumericMap = {
      '0':'ぜろ', '1':'いち', '2':'に', '3':'さん', '4':'よん',
      '5':'ご', '6':'ろく', '7':'なな', '8':'はち', '9':'きゅう',
      'a':'えー', 'b':'びー', 'c':'しー', 'd':'でぃー', 'e':'いー',
      'f':'えふ', 'g':'じー', 'h':'えいち', 'i':'あい', 'j':'じぇい',
      'k':'けー', 'l':'える', 'm':'えむ', 'n':'えぬ', 'o':'おー',
      'p':'ぴー', 'q':'きゅー', 'r':'あーる', 's':'えす', 't':'てぃー',
      'u':'ゆー', 'v':'ぶい', 'w':'だぶりゅー', 'x':'えっくす', 'y':'わい', 'z':'ぜっと',
      'A':'えー', 'B':'びー', 'C':'しー', 'D':'でぃー', 'E':'いー',
      'F':'えふ', 'G':'じー', 'H':'えいち', 'I':'あい', 'J':'じぇい',
      'K':'けー', 'L':'える', 'M':'えむ', 'N':'えぬ', 'O':'おー',
      'P':'ぴー', 'Q':'きゅー', 'R':'あーる', 'S':'えす', 'T':'てぃー',
      'U':'ゆー', 'V':'ぶい', 'W':'だぶりゅー', 'X':'えっくす', 'Y':'わい', 'Z':'ぜっと',
      '０':'ぜろ', '１':'いち', '２':'に', '３':'さん', '４':'よん',
      '５':'ご', '６':'ろく', '７':'なな', '８':'はち', '９':'きゅう',
      'Ａ':'えー', 'Ｂ':'びー', 'Ｃ':'しー', 'Ｄ':'でぃー', 'Ｅ':'いー',
      'Ｆ':'えふ', 'Ｇ':'じー', 'Ｈ':'えいち', 'Ｉ':'あい', 'Ｊ':'じぇい',
      'Ｋ':'けー', 'Ｌ':'える', 'Ｍ':'えむ', 'Ｎ':'えぬ', 'Ｏ':'おー',
      'Ｐ':'ぴー', 'Ｑ':'きゅー', 'Ｒ':'あーる', 'Ｓ':'えす', 'Ｔ':'てぃー',
      'Ｕ':'ゆー', 'Ｖ':'ぶい', 'Ｗ':'だぶりゅー', 'Ｘ':'えっくす', 'Ｙ':'わい', 'Ｚ':'ぜっと',
      'ａ':'えー', 'ｂ':'びー', 'ｃ':'しー', 'ｄ':'でぃー', 'ｅ':'いー',
      'ｆ':'えふ', 'ｇ':'じー', 'ｈ':'えいち', 'ｉ':'あい', 'ｊ':'じぇい',
      'ｋ':'けー', 'ｌ':'える', 'ｍ':'えむ', 'ｎ':'えぬ', 'ｏ':'おー',
      'ｐ':'ぴー', 'ｑ':'きゅー', 'ｒ':'あーる', 'ｓ':'えす', 'ｔ':'てぃー',
      'ｕ':'ゆー', 'ｖ':'ぶい', 'ｗ':'だぶりゅー', 'ｘ':'えっくす', 'ｙ':'わい', 'ｚ':'ぜっと'
    };

    function convertAlphanumericToKana(text) {
      let result = "";
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (alphanumericMap[char]) {
          result += alphanumericMap[char];
        } else {
          result += char;
        }
      }
      return result;
    }

    const supportedChars = (
      "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん" +
      "がぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽぁぃぅぇぉゃゅょっゔー゛゜？！"
    ).split("");

    const smallCharsMap = {
      "ぁ":"あ", "ぃ":"い", "ぅ":"う", "ぇ":"え", "ぉ":"お",
      "ゃ":"や", "ゅ":"ゆ", "ょ":"よ", "っ":"つ"
    };

    let tokenizer = null;

    kuromoji.builder({ dicPath: "https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict" }).build(function (err, _tokenizer) {
      if (err) {
        document.getElementById("loading").innerText = "辞書の読み込みに失敗しました。";
        console.error(err);
        return;
      }
      tokenizer = _tokenizer;
      document.getElementById("loading").style.display = "none";
      const inputEl = document.getElementById("input-text");
      inputEl.disabled = false;
      inputEl.focus();
      
      inputEl.addEventListener("input", handleInput);
    });

    function handleInput(e) {
      if (!tokenizer) return;
      
      const rawText = e.target.value;
      if (!rawText) {
        document.getElementById("hiragana-output").innerText = "";
        document.getElementById("hunter-output").innerHTML = "";
        return;
      }

      const rawLines = rawText.split('\n');
      
      let finalHiraganaText = "";
      let hunterLines = [];

      rawLines.forEach((line, index) => {
        let text = convertAlphanumericToKana(line);
        const path = tokenizer.tokenize(text);
        let hiraganaText = "";
        
        path.forEach(token => {
          if (token.reading) {
            hiraganaText += kataToHira(token.reading);
          } else {
            hiraganaText += kataToHira(token.surface_form);
          }
        });

        let cleanHiragana = "";
        for (let i = 0; i < hiraganaText.length; i++) {
          const c = hiraganaText[i];
          if (c.match(/[\u3041-\u3096ー゛゜？！]/)) {
            cleanHiragana += c;
          }
        }

        finalHiraganaText += cleanHiragana + (index < rawLines.length - 1 ? "\n" : "");
        hunterLines.push(cleanHiragana);
      });

      document.getElementById("hiragana-output").innerText = finalHiraganaText;
      renderHunterMoji(hunterLines);
    }

    function renderHunterMoji(lines) {
      const output = document.getElementById("hunter-output");
      output.innerHTML = "";
      
      lines.forEach(lineText => {
        const lineDiv = document.createElement("div");
        lineDiv.className = "hunter-line";
        
        if (lineText.length === 0) {
          lineDiv.style.height = "50px";
        }

        for (let i = 0; i < lineText.length; i++) {
          let c = lineText[i];
          let isSmall = false;
          let charToLoad = c;

          if (smallCharsMap[c]) {
            isSmall = true;
            charToLoad = smallCharsMap[c]; // 表示用のSVGファイル名はベース文字
          }

          if (supportedChars.includes(charToLoad)) {
            const img = document.createElement("img");
            img.src = `MY_CLEAN_IMAGES/${charToLoad}.svg`;
            img.className = isSmall ? "hunter-char small-char" : "hunter-char";
            img.alt = c;
            lineDiv.appendChild(img);
          } else {
            const span = document.createElement("span");
            span.className = isSmall ? "unsupported-char small-char" : "unsupported-char";
            span.innerText = c;
            lineDiv.appendChild(span);
          }
        }
        
        output.appendChild(lineDiv);
      });
    }

    function downloadImage() {
      // 念の為警告メッセージをリセット
      document.getElementById("download-alert").innerText = "";

      const target = document.getElementById("hunter-output-wrapper");
      
      // html2canvas の仕様により、file:// で開いていると画像を含むキャプチャがCORS制限で失敗します
      if (window.location.protocol === "file:") {
        document.getElementById("download-alert").innerText = "※ ローカルファイル(file://)で開いているため、セキュリティ制限により画像のダウンロードに失敗する可能性があります。ローカルサーバー経由(http://)で開いてください。";
      }

      html2canvas(target, {
        backgroundColor: "#ffffff",
        scale: 2,
        useCORS: true
      }).then(canvas => {
        const link = document.createElement("a");
        link.download = "hunter_moji_translation.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }).catch(err => {
        console.error("画像化に失敗しました", err);
        document.getElementById("download-alert").innerText = "画像のダウンロードに失敗しました。ローカルサーバーを立ち上げてアクセスしてください。";
      });
    }
  </script>
</body>
