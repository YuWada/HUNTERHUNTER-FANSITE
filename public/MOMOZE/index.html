            padding: 10px;

            overflow-x: hidden;

        /* Three.js Background Container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

            max-width: 700px;

            -webkit-backdrop-filter: blur(8px);

            box-shadow: 0 8px 32px rgba(0,0,0,0.8);

            flex-direction: column;
            position: relative;
            z-index: 10;
            transition: all 0.4s ease;
        }

        .hidden-ui {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: scale(0.95);
        }

        #toggle-ui-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;

        #toggle-ui-btn:hover {
            background: rgba(255, 51, 102, 1);
            transform: scale(1.05);
        }

            font-weight: bold;

        .aura-text { color: #53d2dc; text-shadow: 0 0 5px rgba(83,210,220,0.5); }

    <button id="toggle-ui-btn" onclick="toggleUI()">UIを隠す (背景を見る)</button>

        <div id="choices-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const initThreeJS = () => {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.0015);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 40;

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            const torusGeo = new THREE.TorusKnotGeometry(12, 3.5, 150, 20);
            const torusMat = new THREE.MeshStandardMaterial({ 
                color: 0xff3366, wireframe: true, emissive: 0x330011, transparent: true, opacity: 0.4
            });
            const torusKnot = new THREE.Mesh(torusGeo, torusMat);
            scene.add(torusKnot);

            const particlesGeo = new THREE.BufferGeometry();
            const particlesCount = 3000;
            const posArray = new Float32Array(particlesCount * 3);
            for(let i = 0; i < particlesCount * 3; i++) posArray[i] = (Math.random() - 0.5) * 300;
            particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMat = new THREE.PointsMaterial({
                size: 0.4, color: 0x53d2dc, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending
            });
            const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
            scene.add(particlesMesh);

            const floatingObjects = [];
            const colors = [0x4CAF50, 0x2196F3, 0x9C27B0, 0xFF9800];
            for(let i=0; i<30; i++) {
                const geo = new THREE.IcosahedronGeometry(Math.random() * 2.5 + 0.5, 0);
                const mat = new THREE.MeshPhongMaterial({ color: colors[Math.floor(Math.random() * colors.length)], flatShading: true, shininess: 100 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set((Math.random() - 0.5) * 120, (Math.random() - 0.5) * 120, (Math.random() - 0.5) * 80 - 20);
                mesh.userData = {
                    rotSpeedX: (Math.random() - 0.5) * 0.04, rotSpeedY: (Math.random() - 0.5) * 0.04,
                    floatSpeed: (Math.random() - 0.5) * 0.02, initialY: mesh.position.y
                };
                scene.add(mesh);
                floatingObjects.push(mesh);
            }

            const light1 = new THREE.PointLight(0xff0044, 3, 150); scene.add(light1);
            const light2 = new THREE.PointLight(0x0088ff, 3, 150); scene.add(light2);
            scene.add(new THREE.AmbientLight(0x222222));

            let mouseX = 0, mouseY = 0;
            document.addEventListener('mousemove', (event) => {
                mouseX = (event.clientX / window.innerWidth) * 2 - 1;
                mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
            });

            const animate = () => {
                requestAnimationFrame(animate);
                const time = Date.now() * 0.001;

                torusKnot.rotation.x += 0.002;
                torusKnot.rotation.y += 0.004;
                torusKnot.rotation.z += 0.001;
                const scale = 1 + Math.sin(time * 3) * 0.05;
                torusKnot.scale.set(scale, scale, scale);

                particlesMesh.rotation.y += 0.0008;
                particlesMesh.rotation.x -= 0.0004;

                floatingObjects.forEach((obj, index) => {
                    obj.rotation.x += obj.userData.rotSpeedX;
                    obj.rotation.y += obj.userData.rotSpeedY;
                    obj.position.y = obj.userData.initialY + Math.sin(time * 2 + index) * 3;
                });

                camera.position.x += (mouseX * 15 - camera.position.x) * 0.05;
                camera.position.y += (mouseY * 15 - camera.position.y) * 0.05;
                camera.lookAt(scene.position);

                light1.position.x = Math.sin(time * 0.7) * 40;
                light1.position.y = Math.cos(time * 0.5) * 50;
                light1.position.z = Math.cos(time * 0.3) * 40;
                light2.position.x = Math.cos(time * 0.6) * 40;
                light2.position.y = Math.sin(time * 0.8) * 50;
                light2.position.z = Math.sin(time * 0.4) * 40;

                renderer.render(scene, camera);
            };

            animate();
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        };
        window.addEventListener('DOMContentLoaded', initThreeJS);
    </script>

    <script>
        function toggleUI() {
            const container = document.getElementById('game-container');
            const btn = document.getElementById('toggle-ui-btn');
            if (container.classList.contains('hidden-ui')) {
                container.classList.remove('hidden-ui');
                btn.innerText = "UIを隠す (背景を見る)";
                btn.style.background = "rgba(255, 51, 102, 0.7)";
            } else {
                container.classList.add('hidden-ui');
                btn.innerText = "UIを表示する";
                btn.style.background = "rgba(51, 153, 255, 0.7)";
            }
        }

        let player = { hp: 100, aura: 100, flags: [] };
        const MAX_STAT = 100;

        function addLog(msg, type) {
            const logContainer = document.getElementById('log-container');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.innerHTML = `> ${msg}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function modifyStat(type, amount) {
            if (amount === 0) return;
            if (type === 'hp') {
                player.hp = Math.min(MAX_STAT, Math.max(0, player.hp + amount));
                if (amount > 0) addLog(`体力が <span style="color:#aaffaa">+${amount}</span> 回復した。`, 'hp');
                else addLog(`体力を <span style="color:#ff5555">${Math.abs(amount)}</span> 失った！`, 'hp');
            } else if (type === 'aura') {
                player.aura = Math.min(MAX_STAT, Math.max(0, player.aura + amount));
                if (amount > 0) addLog(`オーラが <span style="color:#aaffaa">+${amount}</span> 回復した。`, 'aura');
                else addLog(`オーラを <span style="color:#55ffff">${Math.abs(amount)}</span> 消費した！`, 'aura');
            }
            document.getElementById('hp-val').innerText = player.hp;
            document.getElementById('aura-val').innerText = player.aura;
        }

        function resetGame() {
            player = { hp: 100, aura: 100, flags: [] };
            document.getElementById('log-container').innerHTML = '';
            addLog('ゲームを開始しました。マウスを動かすと背景の念空間が揺らぎます。', 'sys');
            modifyStat('hp', 0);
            modifyStat('aura', 0);
            renderScene('start');
        }

                    { text: "「感謝するぜ お前と出会えた これまでの全てに!!!」", auraCost: 60, next: "scene_king3" },
                    { text: "「祈りとは 心の所作」（極限の精神統一）", hpHeal: 99, auraHeal: 99, next: "scene_king3" },
                    { text: "「沈黙！」（ただ圧倒されて立ち尽くす）", hpCost: 50, next: "scene_king3" }
                ]
            },
            scene_king3: {
                text: "ネテロ「次が最後じゃ。ありったけをぶつけるぜ」\n\n王と会長の激突。巻き込まれれば塵一つ残らない。\n最後の選択だ。",
                choices: [
                    { text: "「もうこれで終わってもいい。だからありったけを」", auraCost: 90, hpCost: 90, next: "true_end" },
                    { text: "「死後強まる念…!!」", hpCost: 99, next: "true_end" }
                ]
            },
            true_end: {
                text: "<span class='true-end'>【TRUE END：偉大なる道草】</span>\n\nあなたは理不尽なハンターの世界を生き抜いた。\n数々の死闘を越え、限界まで絞り出したオーラと命。\n\nジン「道草を楽しめ 大いにな。ほしいものより大切なものが きっとそっちに転がってる」\n\nゲームクリア！本当におめでとう！",
                choices: [{ text: "もう一度遊ぶ", next: "reset" }]
            },
            death_hp: {
                text: "<span class='game-over'>【GAME OVER：体力が尽きた…】</span>\n\n激しい戦いの末、あなたの命の灯火は消えた。\n無理な選択が命取りとなったようだ。\n\n「もうこれで終わってもいい。だからありったけを」",
                choices: [{ text: "最初からやり直す", next: "reset" }]
            },
            death_aura: {
                text: "<span class='game-over'>【GAME OVER：オーラが枯渇した…】</span>\n\nオーラを使い果たし、『絶』の状態に陥ったところを狙われた。\n\nヒソカ「キミの敗因は容量（メモリ）のムダ使い❤︎」",
                choices: [{ text: "最初からやり直す", next: "reset" }]
            }
        };

        function renderScene(sceneId) {
            if (sceneId === "reset") {
                resetGame();
                return;
            }

            const scene = gameData[sceneId];
            const textDisplay = document.getElementById('text-display');
            const choicesContainer = document.getElementById('choices-container');

            textDisplay.innerHTML = scene.text.replace(/\n/g, '<br>');
            choicesContainer.innerHTML = '';

            if (!scene.choices || scene.choices.length === 0) return;

            scene.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                
                const costHp = choice.hpCost || 0;
                const costAura = choice.auraCost || 0;
                const canAffordAura = (player.aura >= costAura);

                let btnHtml = choice.text;
                let tags = [];
                if (costHp > 0) tags.push(`<span class="log-hp">体力-${costHp}</span>`);
                if (costAura > 0) tags.push(`<span class="log-aura">念-${costAura}</span>`);
                if (choice.hpHeal > 0) tags.push(`<span style="color:#aaffaa">体力回復</span>`);
                if (choice.auraHeal > 0) tags.push(`<span style="color:#aaffaa">念回復</span>`);
                
                if (tags.length > 0) {
                    btnHtml += `<span class="cost-tag">${tags.join(' / ')}</span>`;
                }
                
                btn.innerHTML = btnHtml;

                if (!canAffordAura && sceneId !== 'start' && !sceneId.startsWith('bad_') && sceneId !== 'death_hp' && sceneId !== 'death_aura' && sceneId !== 'true_end') {
                    btn.disabled = true;
                } else {
                    btn.onclick = () => {
                        if (costHp > 0) modifyStat('hp', -costHp);
                        if (costAura > 0) modifyStat('aura', -costAura);
                        if (choice.hpHeal) modifyStat('hp', choice.hpHeal);
                        if (choice.auraHeal) modifyStat('aura', choice.auraHeal);

                        if (player.hp <= 0 && sceneId !== 'death_hp' && !sceneId.startsWith('bad_') && sceneId !== 'true_end') {
                            renderScene('death_hp');
                        } else if (player.aura < 0 && sceneId !== 'death_aura' && !sceneId.startsWith('bad_') && sceneId !== 'true_end') {
                            renderScene('death_aura');
                        } else {
                            renderScene(choice.next);
                        }
                    };
                }
                choicesContainer.appendChild(btn);
            });
        }

        window.onload = resetGame;
    </script>
</body>
</html>
